version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: monthly
    time: "08:30"
    timezone: America/Los_Angeles
  open-pull-requests-limit: 10
  labels:
  - dependencies
  groups:
    # Update the compiler, CLI, and presets together, including major upgrades.
    babel:
      patterns:
      - "@babel/*"
    # Keep the parser and plugin on compatible versions.
    typescript-eslint:
      patterns:
      - "@typescript-eslint/*"
    # Batch routine lint/format updates; review major upgrades individually.
    lint-and-format:
      patterns:
      - "eslint"
      - "@eslint/*"
      - "eslint-config-*"
      - "eslint-plugin-*"
      - "prettier"
      update-types:
      - minor
      - patch
